name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: backend
      DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: passage
      POSTGRES_USER: passage
      POSTGRES_PASSWORD: passage
      BADGE_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: passage
          POSTGRES_USER: passage
          POSTGRES_PASSWORD: passage
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U passage -d passage"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: python backend/manage.py makemigrations passage --check --dry-run --noinput
      - name: Run priority QR and offline-sync tests
        run: pytest -q backend/passage/test_badge_security.py backend/passage/test_sync_priority.py
      - name: Run complete backend suite
        run: pytest
      - name: Run passage tests
        run: python backend/manage.py test passage.tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
